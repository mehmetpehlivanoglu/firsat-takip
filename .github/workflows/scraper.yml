name: Trendyol Fırsat Botu

on:
  schedule:
    - cron: "*/15 * * * *" # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch: # Elle tetikleme butonu

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Botu Çalıştır
        run: node scraper.js

      - name: Hafızayı Güncelle (Mükerrer Engelleme İçin)
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f gonderilenler.json ]; then
            git add gonderilenler.json
            git commit -m "Hafıza güncellendi" || true
            git push || true
          fi
