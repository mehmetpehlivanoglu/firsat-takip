<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırsat Takip - Canlı İndirimler & VIP Üyelik</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        header { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        .auth-buttons button { background: #ff6000; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-left: 10px; font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .badge { background: #27ae60; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge.free { background: #7f8c8d; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 200px; object-fit: contain; border-radius: 8px; }
        .card h3 { font-size: 15px; margin: 10px 0; color: #2c3e50; min-height: 40px; }
        .card .fiyat { font-size: 18px; font-weight: bold; color: #e74c3c; margin-bottom: 10px; }
        .card a { display: block; text-align: center; background: #ff6000; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; }

        /* Modal / Form Stilleri */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 320px; text-align: center; position: relative; }
        .modal-content h2 { margin-top: 0; }
        .modal-content input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .modal-content button { width: 98%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Fırsat Takip</h1>
        <div id="auth-section">
            <!-- JavaScript ile dinamik dolacak -->
        </div>
    </header>

    <div class="container">
        <h2>Canlı Fırsatlar</h2>
        <div id="urunler" class="grid">Yükleniyor...</div>
    </div>

    <!-- Giriş / Kayıt Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="modalKapat()">&times;</span>
            <h2 id="modalTitle">Giriş Yap</h2>
            <input type="email" id="email" placeholder="E-posta Adresi">
            <input type="password" id="password" placeholder="Şifre">
            <button id="modalActionBtn" onclick="authIslem()">Giriş Yap</button>
            <p id="modalToggleText" style="font-size: 13px; margin-top: 15px; cursor: pointer; color: #ff6000;" onclick="formDegistir()">Hesabınız yok mu? Kayıt olun.</p>
        </div>
    </div>

    <script>
        let isLoginState = true;

        async function kullaniciKontrol() {
            const res = await fetch('/api/me');
            const data = await res.json();
            const authSection = document.getElementById('auth-section');

            if (data.loggedIn) {
                authSection.innerHTML = `
                    <div class="user-info">
                        <span>${data.eposta}</span>
                        <span class="badge ${data.isVIP ? '' : 'free'}">${data.isVIP ? 'VIP Üye' : 'Ücretsiz Üye'}</span>
                        <button onclick="cikisYap()" style="background:#e74c3c;">Çıkış</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <div class="auth-buttons">
                        <button onclick="modalAc(true)">Giriş Yap</button>
                        <button onclick="modalAc(false)">Kayıt Ol</button>
                    </div>
                `;
            }
        }

        function modalAc(isLogin) {
            isLoginState = isLogin;
            document.getElementById('modalTitle').innerText = isLogin ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('modalActionBtn').innerText = isLogin ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('modalToggleText').innerText = isLogin ? 'Hesabınız yok mu? Kayıt olun.' : 'Zaten hesabınız var mı? Giriş yapın.';
            document.getElementById('authModal').style.display = 'flex';
        }

        function modalKapat() { document.getElementById('authModal').style.display = 'none'; }
        function formDegistir() { modalAc(!isLoginState); }

        async function authIslem() {
            const eposta = document.getElementById('email').value;
            const sifre = document.getElementById('password').value;
            const endpoint = isLoginState ? '/api/giris' : '/api/kayit';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eposta, sifre })
            });

            const data = await res.json();
            if (res.ok) {
                alert(isLoginState ? 'Giriş başarılı!' : 'Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
                modalKapat();
                kullaniciKontrol();
            } else {
                alert(data.error);
            }
        }

        async function cikisYap() {
            await fetch('/api/cikis');
            kullaniciKontrol();
        }

        async function firsatlariYukle() {
            try {
                const res = await fetch('/api/firsatlar');
                const urunler = await res.json();
                const container = document.getElementById('urunler');
                container.innerHTML = '';

                urunler.forEach(u => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${u.resim || 'https://via.placeholder.com/200'}" alt="${u.baslik}">
                            <h3>${u.baslik}</h3>
                            <div class="fiyat">${u.fiyat}</div>
                            <a href="${u.link}" target="_blank">Ürüne Git</a>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('urunler').innerHTML = 'Veriler yüklenemedi.';
            }
        }

        kullaniciKontrol();
        firsatlariYukle();
    </script>
</body>
</html>
